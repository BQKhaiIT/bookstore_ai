openapi: 3.1.0
info:
  title: BookStore AI — Admin API
  version: 1.0.0
  description: Admin REST API (prefix `/api/v1/admin`), Sanctum cookie session + verified admin.

servers:
  - url: http://localhost:8000/api/v1/admin

tags:
  - name: Admin

security:
  - cookieAuth: []

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: laravel_session

paths:
  /dashboard:
    get:
      tags: [Admin]
      summary: Thống kê dashboard
      responses:
        '200':
          description: OK
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden

  /books:
    get:
      tags: [Admin]
      summary: Danh sách sách (search, filter, pagination)
      responses:
        '200':
          description: OK
    post:
      tags: [Admin]
      summary: Tạo sách
      responses:
        '201':
          description: Created

  /books/{book}:
    get:
      tags: [Admin]
      summary: Chi tiết sách
      responses:
        '200':
          description: OK
    patch:
      tags: [Admin]
      summary: Cập nhật sách
      responses:
        '200':
          description: OK
    delete:
      tags: [Admin]
      summary: Xóa hoặc lưu trữ sách
      responses:
        '204':
          description: Deleted
        '200':
          description: Archived when có order_items

  /books/{book}/cover:
    post:
      tags: [Admin]
      summary: Upload ảnh bìa lên Cloudinary (JPG/PNG/WebP, tối đa 5MB)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [cover]
              properties:
                cover:
                  type: string
                  format: binary
      responses:
        '200':
          description: OK — BookResource (cover_url, cover_public_id, cover_asset_id)
        '422':
          description: Validation error
        '502':
          description: Cloudinary upload failed
    put:
      tags: [Admin]
      summary: Gán ảnh bìa từ asset Cloudinary có sẵn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [public_id]
              properties:
                public_id:
                  type: string
      responses:
        '200':
          description: OK
        '422':
          description: Asset not found hoặc validation error
    delete:
      tags: [Admin]
      summary: Gỡ ảnh bìa (chỉ xóa tham chiếu DB, không xóa asset Cloudinary)
      responses:
        '200':
          description: OK

  /cloudinary/images:
    get:
      tags: [Admin]
      summary: Duyệt/tìm ảnh Cloudinary (Search API khi có search, cursor pagination)
      parameters:
        - in: query
          name: search
          schema:
            type: string
            maxLength: 128
          description: Tìm theo prefix tên file / public_id (server-side)
        - in: query
          name: per_page
          schema:
            type: integer
            maximum: 100
        - in: query
          name: cursor
          schema:
            type: string
      responses:
        '200':
          description: OK
        '502':
          description: Cloudinary list failed

  /categories:
    get:
      tags: [Admin]
      summary: Danh sách danh mục
      responses:
        '200':
          description: OK
    post:
      tags: [Admin]
      summary: Tạo danh mục
      responses:
        '201':
          description: Created

  /categories/{category}:
    get:
      tags: [Admin]
      summary: Chi tiết danh mục
      responses:
        '200':
          description: OK
    patch:
      tags: [Admin]
      summary: Cập nhật danh mục
      responses:
        '200':
          description: OK
    delete:
      tags: [Admin]
      summary: Xóa danh mục
      responses:
        '204':
          description: Deleted

  /authors:
    get:
      tags: [Admin]
      summary: Danh sách tác giả
      responses:
        '200':
          description: OK
    post:
      tags: [Admin]
      summary: Tạo tác giả
      responses:
        '201':
          description: Created

  /authors/{author}:
    get:
      tags: [Admin]
      summary: Chi tiết tác giả
      responses:
        '200':
          description: OK
    patch:
      tags: [Admin]
      summary: Cập nhật tác giả
      responses:
        '200':
          description: OK
    delete:
      tags: [Admin]
      summary: Xóa tác giả
      responses:
        '204':
          description: Deleted

  /publishers:
    get:
      tags: [Admin]
      summary: Danh sách NXB
      responses:
        '200':
          description: OK
    post:
      tags: [Admin]
      summary: Tạo NXB
      responses:
        '201':
          description: Created

  /publishers/{publisher}:
    get:
      tags: [Admin]
      summary: Chi tiết NXB
      responses:
        '200':
          description: OK
    patch:
      tags: [Admin]
      summary: Cập nhật NXB
      responses:
        '200':
          description: OK
    delete:
      tags: [Admin]
      summary: Xóa NXB
      responses:
        '204':
          description: Deleted

  /orders:
    get:
      tags: [Admin]
      summary: Danh sách đơn hàng
      responses:
        '200':
          description: OK

  /orders/{order}:
    get:
      tags: [Admin]
      summary: Chi tiết đơn hàng
      responses:
        '200':
          description: OK

  /orders/{order}/status:
    patch:
      tags: [Admin]
      summary: Cập nhật trạng thái đơn
      responses:
        '200':
          description: OK
        '409':
          description: State conflict

  /payments:
    get:
      tags: [Admin]
      summary: Danh sách thanh toán
      responses:
        '200':
          description: OK

  /payments/{payment}/confirm-cod:
    post:
      tags: [Admin]
      summary: Xác nhận COD
      responses:
        '200':
          description: OK

  /users:
    get:
      tags: [Admin]
      summary: Danh sách người dùng
      responses:
        '200':
          description: OK

  /users/{user}/status:
    patch:
      tags: [Admin]
      summary: Khóa/mở khóa tài khoản
      responses:
        '200':
          description: OK

  /reviews:
    get:
      tags: [Admin]
      summary: Danh sách đánh giá
      responses:
        '200':
          description: OK

  /reviews/{review}:
    patch:
      tags: [Admin]
      summary: Duyệt/từ chối đánh giá
      responses:
        '200':
          description: OK

  /banners:
    get:
      tags: [Admin]
      summary: Danh sách Hero/Banner (permission banners)
      responses:
        '200':
          description: OK
    post:
      tags: [Admin]
      summary: Tạo banner
      responses:
        '201':
          description: Created

  /banners/{id}:
    get:
      tags: [Admin]
      summary: Chi tiết banner
      responses:
        '200':
          description: OK
    patch:
      tags: [Admin]
      summary: Cập nhật banner
      responses:
        '200':
          description: OK
    delete:
      tags: [Admin]
      summary: Xóa banner
      responses:
        '204':
          description: No Content

  /banners/{id}/image:
    post:
      tags: [Admin]
      summary: Upload/gán ảnh desktop hoặc mobile (multipart variant + image|public_id)
      responses:
        '200':
          description: OK
