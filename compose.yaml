name: bookstore

x-backend-env: &backend-env
  DB_HOST: postgres
  DB_PORT: "5432"
  APP_DEBUG: "false"
  LOG_LEVEL: info
  TRUSTED_PROXIES: "*"

x-backend-volumes: &backend-volumes
  - ./backend/.env:/var/www/html/.env:ro
  - backend_storage:/var/www/html/storage

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:18-bookworm
    restart: unless-stopped
    env_file:
      - docker/secrets/postgres.env
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=40
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    mem_limit: 512m
    logging: *default-logging

  backend:
    image: bookstore-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *backend-env
    volumes: *backend-volumes
    ports:
      - "127.0.0.1:8000:80"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/up"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    mem_limit: 768m
    logging: *default-logging

  queue:
    image: bookstore-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=90"]
    environment:
      <<: *backend-env
    volumes: *backend-volumes
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    mem_limit: 384m
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    mem_limit: 128m
    logging: *default-logging

  frontend-dev:
    profiles: ["dev"]
    image: node:22-bookworm
    working_dir: /app
    command: ["sh", "-c", "if [ ! -x node_modules/.bin/vite ]; then npm ci; fi && npm run dev -- --host 0.0.0.0 --port 5174"]
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_DEV_POLLING: "1"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:5174:5174"
    mem_limit: 1024m
    logging: *default-logging

  ngrok:
    image: ngrok/ngrok:3
    restart: unless-stopped
    env_file:
      - docker/secrets/ngrok.env
    command:
      - http
      - --domain=squishy-showcase-lapped.ngrok-free.dev
      - --region=ap
      - --log=stdout
      - --log-level=info
      - backend:80
    ports:
      - "127.0.0.1:4040:4040"
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 128m
    logging: *default-logging

  pgadmin:
    profiles: ["tools"]
    image: dpage/pgadmin4:9
    restart: unless-stopped
    env_file:
      - docker/secrets/pgadmin.env
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m
    logging: *default-logging

secrets:
  db_password:
    file: ./docker/secrets/db_password

volumes:
  postgres_data:
  backend_storage:
  frontend_node_modules:
  pgadmin_data:
